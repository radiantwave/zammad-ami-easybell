name: Image

# Baut das Abbild und pusht es als ghcr.io/radiantwave/zammad-ami-easybell in die
# GitHub Container Registry: bei jedem Push auf main als :dev, bei einem
# Versions-Tag als :1.2.3 und :1.2. :latest bekommt nur die höchste Version,
# ein nachgereichter Fehlerstand einer alten Reihe also nicht. Kein Deploy, das
# Ziehen und Starten passiert separat.
#
# Actions sind auf einen vollen Commit-SHA gepinnt (Supply-Chain-Härtung); der
# Kommentar dahinter nennt die Version. Dependabot hält die SHAs aktuell.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # alle Tags, sonst ist die höchste Version nicht bekannt

      - name: Höchste Version bestimmen
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          hoechste=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -1)
          echo "Höchste Version: ${hoechste:-keine}, gebaut wird: $TAG"
          [ -n "$hoechste" ] && [ "$TAG" = "$hoechste" ] && ist_neueste=true || ist_neueste=false
          echo "ist_neueste=$ist_neueste" >> "$GITHUB_OUTPUT"

      - name: Übersetzung prüfen
        run: |
          npm ci
          npm run lint

      - name: In ghcr.io anmelden
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten (Tag & OCI-Labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/radiantwave/zammad-ami-easybell
          # latest setzt der Schritt oben, damit es an der höchsten Version hängt
          # und nicht am zuletzt gepushten Tag.
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.version.outputs.ist_neueste == 'true' }}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image bauen und pushen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
