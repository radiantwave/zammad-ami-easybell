name: Image

# Baut das Abbild und pusht es als ghcr.io/radiantwave/zammad-ami-easybell in die
# GitHub Container Registry: bei jedem Push auf main als :latest, bei einem
# Versions-Tag zusätzlich als :1.2.3 und :1.2. Kein Deploy, das Ziehen und
# Starten passiert separat.
#
# Actions sind auf einen vollen Commit-SHA gepinnt (Supply-Chain-Härtung); der
# Kommentar dahinter nennt die Version. Dependabot hält die SHAs aktuell.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Übersetzung prüfen
        run: |
          npm ci
          npm run lint

      - name: In ghcr.io anmelden
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten (Tag & OCI-Labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/radiantwave/zammad-ami-easybell
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image bauen und pushen
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
